<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vote for Me — Bitcoin</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#11131a;color:#fff;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center}
.card{width:min(92%,430px);background:#1b1e28;border-radius:24px;padding:28px;box-sizing:border-box;text-align:center;box-shadow:0 12px 40px #0006}

.qr{background:#fff;padding:14px;border-radius:18px;width:220px;max-width:70%;margin:20px auto}
.qr img{width:100%;display:block}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
a.button{display:block;text-decoration:none;background:#fff;color:#111;padding:14px;border-radius:14px;font-weight:700}
.address{font-size:12px;word-break:break-all;background:#11131a;padding:14px;border-radius:12px;color:#dfe2ea}
.small{font-size:12px}
</style>
</head>
<body>
<div class="card">
<div style="font-size:42px">🗳️</div>
<h1>Vote for Me</h1>

<div class="buttons">

<a class="button" href="bitcoin:bc1q7dwqaz3gs87tarraspp6sxm007lr92wptgxnrd?amount=0.00012&label=Vote%20for%20me&message=Vote%20for%20me">$10</a>

</div>

<div class="address">bc1q7dwqaz3gs87tarraspp6sxm007lr92wptgxnrd</div>

</html>
